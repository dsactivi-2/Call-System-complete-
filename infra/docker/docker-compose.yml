# =============================================================================
# AI Call Agent – Docker Compose (development)
# =============================================================================
# TODO: tune resource limits, secrets management, and volumes for production
# =============================================================================

version: "3.9"

services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/callsystem}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    env_file:
      - ../../.env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/callsystem}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    env_file:
      - ../../.env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: callsystem
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres   # TODO: use Docker secrets in production
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pg_data:
